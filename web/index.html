<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="臺北市 23 萬棟建物的危老耐震風險分數地圖，與「我家安全嗎？」健檢卡。分數可解釋、權重可調。" />
    <title>危老耐震風險地圖</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/map">臺北市危老耐震風險</a>
      <nav class="tabs" aria-label="主選單">
        <a href="#/map" data-route="map">風險地圖</a>
        <a href="#/check" data-route="check">我家安全嗎？</a>
        <a href="#/about" data-route="about">資料與方法</a>
      </nav>
      <a class="gh-link" href="https://github.com/jimmylai-921/pumathon-risk-map" target="_blank" rel="noopener"
        aria-label="GitHub 原始碼" title="GitHub 原始碼">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span class="gh-text">GitHub</span>
      </a>
    </header>

    <dialog id="welcome" class="welcome" aria-labelledby="welcome-title">
      <form method="dialog">
        <button class="welcome-close" value="close" aria-label="關閉">×</button>
        <h2 id="welcome-title">你住台北市嗎？</h2>
        <p>立即查詢自家耐震危老指數</p>
        <div class="welcome-actions">
          <button class="btn" value="check">立即查詢</button>
          <button class="btn btn-ghost" value="close">先看地圖</button>
        </div>
      </form>
    </dialog>

    <div id="loading" class="loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-msg">載入資料中…</p>
    </div>

    <div id="toast" class="toast" role="alert" hidden></div>

    <main>
      <section id="view-map" class="view view-map" hidden>
        <aside id="sidebar" class="sidebar" aria-label="權重與排行榜"></aside>
        <div class="map-wrap">
          <div id="map" class="map"></div>
          <div class="map-mode" id="map-mode">
            <div class="seg-toggle" role="radiogroup" aria-label="地圖檢視">
              <button data-mode="building" class="on" role="radio" aria-checked="true">逐棟</button>
              <button data-mode="village" role="radio" aria-checked="false">里別</button>
            </div>
            <label class="vmetric" hidden>上色
              <select id="v-metric"></select>
            </label>
          </div>
        </div>
        <aside id="drawer" class="drawer" hidden aria-label="分數說明">
          <button id="drawer-close" class="drawer-close" aria-label="關閉說明面板">×</button>
          <div id="drawer-body"></div>
        </aside>
      </section>

      <section id="view-check" class="view view-check" hidden>
        <div class="check-inner">
          <h1>我家安全嗎？</h1>
          <p class="lead">輸入門牌地址，看看你家的耐震風險分數是怎麼算出來的，以及下一步可以做什麼。</p>
          <form id="check-form" class="check-form" autocomplete="off">
            <label for="addr-input" class="sr-only">門牌地址</label>
            <input id="addr-input" type="search" inputmode="text" enterkeyhint="search"
              placeholder="例：臺北市中山區民生東路二段32號3樓" />
            <button class="btn" type="submit">查詢</button>
          </form>
          <p class="hint">可含或不含「臺北市」「行政區」與樓層；沒寫行政區會搜尋全市（需多下載一些資料）。</p>
          <div id="check-status" class="check-status" aria-live="polite"></div>
          <div id="card-out"></div>
        </div>
      </section>

      <section id="view-about" class="view view-about" hidden>
        <div class="check-inner" id="about-out"></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
